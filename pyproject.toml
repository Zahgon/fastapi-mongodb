[project]
name = "flask-mongodb"
version = "0.1.0"
description = "Flask MongoDB application (migrated from FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.0.0",
    "pymongo>=4.6.0",
    "pydantic>=2.5.0,<2.11",
    "pydantic-settings>=2.1.0,<2.8",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "rich>=13.0.0",
    "ruff>=0.1.0",
    "inline-snapshot>=0.18.0",
]
